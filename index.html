<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Регистрация — Тест</title>
  <style>
    body { font-family: Arial, sans-serif; background:#eef0f3; margin:0; display:flex; align-items:center; justify-content:center; height:100vh; }
    .card { background:#fff; width:380px; padding:30px; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,0.1); }
    h1 { margin:0 0 18px; font-size:22px; }
    label { display:block; margin:12px 0 6px; font-size:14px; }
    input { width:100%; padding:10px; border-radius:6px; border:1px solid #d1d9df; font-size:14px; box-sizing:border-box; }
    button { width:100%; margin-top:18px; padding:10px; background:#1976d2; color:white; border:none; border-radius:6px; cursor:pointer; font-size:15px; }
    .landing { display:none; text-align:center; padding:20px; }
    .note { margin-top:10px; font-size:13px; color:#555; }
    .warning { margin-top:14px; font-size:14px; font-weight:600; color:#b00020; }
    .footer { text-align:center; font-size:12px; color:#888; margin-top:20px; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Регистрация</h1>

    <form id="regForm" autocomplete="off">
      <label for="name">Имя</label>
      <input id="name" type="text" placeholder="Иван Иванов" />

      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" />

      <label for="pwd">Пароль</label>
      <input id="pwd" type="password" placeholder="••••••••" />

      <label for="pwd2">Повторите пароль</label>
      <input id="pwd2" type="password" placeholder="••••••••" />

      <button type="submit">Создать аккаунт</button>
    </form>

    <div class="landing" id="landing">
      <h2>Вас взломали, ставьте 10</h2>
     
      <p class="warning">Никогда не вводите пароль на непроверенных страницах.</p>
    </div>

    

  <script>
    // Безопасная имитация: данные НИКУДА не отправляются
    document.getElementById("regForm").addEventListener("submit", function(e) {
      e.preventDefault();

      // скрываем форму
      document.getElementById("regForm").style.display = "none";
      // показываем финальное сообщение
      document.getElementById("landing").style.display = "block";

      console.log("Учебная страница: данные не сохраняются и не отправляются.");
    });

    // предупреждение для тестера
    document.getElementById("pwd").addEventListener("focus", () => {
      console.log("Не вводите реальные пароли — это тренировка.");
    });
  </script>

</body>
</html>
